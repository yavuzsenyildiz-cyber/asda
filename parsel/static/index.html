<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsel Takip</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--fg:#1f2a24;--muted:#66706a;--line:#d9d6cc;--accent:#2f6b4f;--accent-fg:#fff;--warn:#b4530a;--sel:#e3f1e8;--rej:#8a8a8a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--card:#1e2426;--fg:#e8ebe6;--muted:#9aa5a0;--line:#333c3e;--accent:#5fb98a;--accent-fg:#0d1a13;--warn:#e59a5a;--sel:#1f3a2b;--rej:#777;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Segoe UI",sans-serif;padding:16px}
main{max-width:1100px;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:1.6rem}
.sub{color:var(--muted);margin:2px 0 0}
.banner{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
input,select,textarea,button{font:inherit;color:var(--fg)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0;width:100%}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.item.shortlist{background:var(--sel);border-color:var(--accent)}
.item.rejected{opacity:.55}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.title{font-weight:650;text-decoration:none;color:var(--fg);overflow-wrap:anywhere}
.title:hover{text-decoration:underline}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.tag.ihale{border-color:var(--warn);color:var(--warn)}
.tag.demo{border-color:var(--warn);color:var(--warn)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions input{flex:1 1 180px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
small.err{color:var(--warn)}
</style>
</head>
<body>
<main>
  <div>
    <h1>Parsel Takip</h1>
    <p class="sub">Emlak ve ihale ilanlarından parsel topla, filtrele, beğendiklerini seç.</p>
  </div>

  <div class="banner" id="demoBanner" hidden>
    <span>Şu an <b>örnek veriler</b> gösteriliyor. Gerçek ilan değiller.</span>
    <button id="delDemo">Örnek verileri sil</button>
  </div>

  <div class="bar tabs" id="tabs">
    <button data-s="" class="on">Tümü</button>
    <button data-s="shortlist">Seçilenler</button>
    <button data-s="rejected">Elenenler</button>
    <span style="flex:1"></span>
    <button id="scan" class="primary">Şimdi tara</button>
    <a href="/api/export.csv"><button>Seçilenleri CSV indir</button></a>
  </div>
  <div id="scanMsg" class="sub"></div>

  <section class="filters" aria-label="Filtreler">
    <label>Ara<input id="q" placeholder="ilçe, başlık, imar"></label>
    <label>İl<select id="city"><option value="">Hepsi</option></select></label>
    <label>Tür<select id="lt"><option value="">Hepsi</option><option value="satilik">Satılık</option><option value="ihale">İhale</option></select></label>
    <label>Kaynak<select id="source"><option value="">Hepsi</option></select></label>
    <label>Min fiyat (TL)<input id="min_price" inputmode="numeric"></label>
    <label>Max fiyat (TL)<input id="max_price" inputmode="numeric"></label>
    <label>Min m²<input id="min_area" inputmode="numeric"></label>
    <label>Max m²<input id="max_area" inputmode="numeric"></label>
    <label>Sırala<select id="sort"><option value="new">En yeni</option><option value="price">Fiyat (artan)</option><option value="area">Alan (artan)</option><option value="ppm2">m² fiyatı (artan)</option><option value="deadline">İhale son tarihi</option></select></label>
  </section>

  <div id="count" class="sub"></div>
  <div id="list" class="grid"></div>

  <details>
    <summary>Elle parsel ekle</summary>
    <form class="form" id="manual">
      <label>Link<input id="m_url" required placeholder="https://..."></label>
      <label>Başlık<input id="m_title"></label>
      <label>Fiyat<input id="m_price" placeholder="2.500.000"></label>
      <label>m²<input id="m_area"></label>
      <label>İl / İlçe<input id="m_loc" placeholder="İzmir / Çeşme"></label>
      <label>İmar<input id="m_zon"></label>
      <label>Tür<select id="m_lt"><option value="satilik">Satılık</option><option value="ihale">İhale</option></select></label>
      <label>&nbsp;<button class="primary" type="submit">Ekle</button></label>
    </form>
  </details>

  <details>
    <summary>Tarama durumu</summary>
    <div id="status" class="sub" style="margin-top:8px"></div>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
let status = "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tl = n => n == null ? "—" : new Intl.NumberFormat("tr-TR").format(Math.round(n)) + " TL";
const num = n => n == null ? "—" : new Intl.NumberFormat("tr-TR").format(n);

function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch { return "#"; } }

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status); return r.json(); }

async function loadFacets(){
  const f = await api("/api/facets");
  for (const [id, list] of [["city", f.cities], ["source", f.sources]]) {
    const sel = $(id), cur = sel.value;
    sel.innerHTML = '<option value="">Hepsi</option>' + list.map(v => `<option>${esc(v)}</option>`).join("");
    sel.value = cur;
  }
  $("demoBanner").hidden = !f.demo;
}

async function load(){
  const p = new URLSearchParams();
  const map = {q:"q", city:"city", lt:"listing_type", source:"source", min_price:"min_price", max_price:"max_price", min_area:"min_area", max_area:"max_area", sort:"sort"};
  for (const [id, key] of Object.entries(map)) {
    const v = $(id).value.trim().replace(/\./g, "");
    if (v && !["q","city","lt","source","sort"].includes(id) && isNaN(v)) continue;
    if (v) p.set(key, ["q","city","lt","source","sort"].includes(id) ? $(id).value.trim() : v);
  }
  if (status) p.set("status", status);
  const rows = await api("/api/parcels?" + p);
  $("count").textContent = rows.length + " parsel";
  $("list").innerHTML = rows.length ? rows.map(card).join("") : '<div class="empty">Bu filtrelerle parsel yok. Filtreleri gevşet ya da "Şimdi tara"ya bas.</div>';
}

function card(r){
  const loc = [r.city, r.district].filter(Boolean).join(" / ") || "Konum yok";
  return `<article class="item ${r.status}" data-id="${r.id}">
    <div class="top">
      <a class="title" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">${esc(r.title || r.url)}</a>
      <span class="price">${tl(r.price)}</span>
    </div>
    <div class="meta">
      <span class="tag ${r.listing_type}">${r.listing_type === "ihale" ? "İhale" : "Satılık"}</span>
      ${r.demo ? '<span class="tag demo">Örnek</span>' : ""}
      <span>${esc(loc)}</span><span>${num(r.area_m2)} m²</span>
      ${r.price_per_m2 ? `<span>${tl(r.price_per_m2)}/m²</span>` : ""}
      ${r.zoning ? `<span>${esc(r.zoning)}</span>` : ""}
      ${r.deadline ? `<span>Son tarih: ${esc(r.deadline)}</span>` : ""}
      <span>${esc(r.source)}</span>
    </div>
    <div class="actions">
      <button data-a="shortlist" class="${r.status==='shortlist'?'primary':''}">${r.status==='shortlist'?'Seçildi':'Seç'}</button>
      <button data-a="rejected">${r.status==='rejected'?'Geri al':'Ele'}</button>
      <input data-note placeholder="Not" value="${esc(r.note)}" aria-label="Not">
    </div>
  </article>`;
}

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const art = b.closest("article"), id = art.dataset.id;
  const cur = art.className.includes("shortlist") ? "shortlist" : art.className.includes("rejected") ? "rejected" : "new";
  const next = b.dataset.a === cur ? "new" : b.dataset.a;
  await api("/api/parcels/" + id, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status:next})});
  load();
});
$("list").addEventListener("change", async e => {
  if (!e.target.matches("[data-note]")) return;
  await api("/api/parcels/" + e.target.closest("article").dataset.id, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({note:e.target.value})});
});

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-s]"); if (!b) return;
  status = b.dataset.s;
  [...$("tabs").querySelectorAll("button[data-s]")].forEach(x => x.classList.toggle("on", x === b));
  load();
});

let t; document.querySelectorAll(".filters input,.filters select").forEach(el => el.addEventListener("input", () => { clearTimeout(t); t = setTimeout(load, 250); }));

$("delDemo").onclick = async () => { await api("/api/demo", {method:"DELETE"}); await loadFacets(); load(); };

$("manual").addEventListener("submit", async e => {
  e.preventDefault();
  await api("/api/parcels", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
    url:$("m_url").value, title:$("m_title").value, price:$("m_price").value, area:$("m_area").value,
    location:$("m_loc").value, zoning:$("m_zon").value, listing_type:$("m_lt").value})});
  e.target.reset(); await loadFacets(); load();
});

async function refreshStatus(){
  const s = await api("/api/scrape/status");
  const lines = [];
  lines.push(s.enabled.length ? "Açık kaynaklar: " + s.enabled.map(esc).join(", ") : "Hiç kaynak açık değil. <code>sources.yaml</code> içinde bir kaynağı <code>enabled: true</code> yapıp seçicilerini kontrol et.");
  for (const r of s.runs) lines.push(`${esc(r.finished||"")} · ${esc(r.source)} · ${r.found} ilan, ${r.new} yeni` + (r.error ? ` · <small class="err">${esc(r.error)}</small>` : ""));
  $("status").innerHTML = lines.join("<br>");
  return s;
}

$("scan").onclick = async () => {
  try { await api("/api/scrape", {method:"POST"}); } catch (e) { $("scanMsg").textContent = e.message; return; }
  $("scanMsg").textContent = "Taranıyor…";
  const timer = setInterval(async () => {
    const s = await refreshStatus();
    if (!s.running) {
      clearInterval(timer);
      $("scanMsg").textContent = s.enabled.length ? "Tarama bitti." : "Açık kaynak yok. Tarama için sources.yaml'da bir kaynağı aç.";
      await loadFacets(); load();
    }
  }, 1500);
};

loadFacets().then(load); refreshStatus();
</script>
</body>
</html>
